server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any route not found as a static file.
    # This lets React Router handle /sessions, /chat, etc. without nginx 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames by Vite)
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access log for health checks to reduce noise
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
