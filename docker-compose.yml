version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${NEON_DATABASE_URL}
      - AGENT_SERVICE_URL=http://agent-service:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_PROVIDER_FALLBACK=${LLM_PROVIDER_FALLBACK:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent-service

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Optional: override at build time with --build-arg VITE_API_URL=http://yourhost:8000
        # Default in App.tsx is http://localhost:8000, which works for local Docker.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      - api
